spring.application.name=sglu
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sglu}
spring.datasource.username=${DB_USERNAME:sglu}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

sglu.security.jwt.secret=${JWT_SECRET}
sglu.security.jwt.issuer=sglu-backend
sglu.security.jwt.expiration=${JWT_EXPIRATION:PT1H}

sglu.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
sglu.bootstrap.admin.nome=${BOOTSTRAP_ADMIN_NAME:}
sglu.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
sglu.bootstrap.admin.senha=${BOOTSTRAP_ADMIN_PASSWORD:}
